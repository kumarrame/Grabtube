<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — GrabTube</title>
  <meta name="description" content="Contact GrabTube for questions, feedback, or DMCA requests.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar">
  <a href="/" class="nav-logo">Grab<span>Tube</span></a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
  </div>
</nav>
<div class="wrapper">
  <div class="page-content">
    <h1>Contact Us</h1>
    <p>Have questions, feedback, or DMCA requests? Reach out to us.</p>
    <form class="contact-form" id="contactForm">
      <div class="form-group">
        <label for="contactName">Name</label>
        <input type="text" id="contactName" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label for="contactEmail">Email</label>
        <input type="email" id="contactEmail" placeholder="your@email.com" required>
      </div>
      <div class="form-group">
        <label for="contactMsg">Message</label>
        <textarea id="contactMsg" rows="5" placeholder="Your message..." required></textarea>
      </div>
      <button type="submit" class="download-btn" style="max-width:200px;">Send Message</button>
    </form>
  </div>
  <footer class="footer">
    <div class="footer-links">
      <a href="/">Home</a>
      <a href="/about">About</a>
      <a href="/privacy">Privacy</a>
      <a href="/terms">Terms</a>
      <a href="/contact">Contact</a>
    </div>
    <p>&copy; 2025 GrabTube. All rights reserved.</p>
  </footer>
</div>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
